name: memoia-inspector-test

services:
  inspector:
    image: ${INSPECTOR_IMAGE:?Set the accepted GHCR manifest digest}
    env_file:
      - .env
    ports:
      - "127.0.0.1:3001:3000"
    restart: unless-stopped
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/settings').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
