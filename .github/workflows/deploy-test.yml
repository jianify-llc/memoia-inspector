name: Memoia Inspector · Test

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  validate-test:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require the selected current Test branch
        env:
          SELECTED_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$SELECTED_REF" == refs/heads/test ]] || { echo 'Select the Test branch explicitly' >&2; exit 1; }
          [[ "$(git ls-remote origin refs/heads/test | cut -f1)" == "$GITHUB_SHA" ]] || { echo 'A newer Test commit exists' >&2; exit 1; }

  verify:
    needs: validate-test
    uses: ./.github/workflows/verify.yml
    with:
      mode: publish

  publish-test:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      packages: write
    concurrency:
      group: inspector-image-${{ github.sha }}
      cancel-in-progress: false
    outputs:
      digest: ${{ steps.identity.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Find an existing image for this source commit
        id: existing
        run: |
          set -euo pipefail
          tag="$IMAGE:sha-$GITHUB_SHA"
          if docker buildx imagetools inspect "$tag" >/dev/null 2> "$RUNNER_TEMP/registry-error"; then
            digest=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' | jq -r .digest)
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            grep -Fx "ERROR: $tag: not found" "$RUNNER_TEMP/registry-error" >/dev/null || { cat "$RUNNER_TEMP/registry-error" >&2; exit 1; }
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Build Test AMD64 once per commit
        if: ${{ steps.existing.outputs.exists != 'true' }}
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          build-args: SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
      - name: Verify architectures, source labels, and anonymous pulls
        id: identity
        env:
          EXISTING_DIGEST: ${{ steps.existing.outputs.digest }}
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          digest="${EXISTING_DIGEST:-$BUILT_DIGEST}"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          image="$IMAGE@$digest"
          docker buildx imagetools inspect "$image" --raw > "$RUNNER_TEMP/inspector-manifest.json"
          anonymous_config=$(mktemp -d)
          trap 'rm -rf -- "$anonymous_config"' EXIT
          for arch in amd64; do
            platform_digest=$(jq -er --arg arch "$arch" '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest] | if length == 1 then .[0] else error("Missing or duplicate platform") end' "$RUNNER_TEMP/inspector-manifest.json")
            platform_image="$IMAGE@$platform_digest"
            DOCKER_CONFIG="$anonymous_config" docker pull --platform "linux/$arch" "$platform_image"
            docker image inspect "$platform_image" --format '{{.Os}}/{{.Architecture}}' | grep -Fx "linux/$arch"
            docker image inspect "$platform_image" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' | grep -Fx "$GITHUB_SHA"
          done
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          printf 'Source: %s\nImage: %s\nPlatforms: amd64\n' "$GITHUB_SHA" "$image" >> "$GITHUB_STEP_SUMMARY"

  deploy-test:
    if: ${{ vars.INSPECTOR_TEST_DEPLOY_ENABLED == 'true' }}
    needs: publish-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: memoia-inspector-test-deployment
      cancel-in-progress: false
    environment:
      name: test
      url: https://test-memoia-inspector.jianify.dev
      deployment: false
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
      INSPECTOR_OPENAI_API_KEY: ${{ secrets.INSPECTOR_OPENAI_API_KEY }}
      INSPECTOR_OPENAI_BASE_URL: ${{ secrets.INSPECTOR_OPENAI_BASE_URL }}
      INSPECTOR_OPENAI_MODEL: ${{ secrets.INSPECTOR_OPENAI_MODEL }}
      DIGEST: ${{ needs.publish-test.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install or update Inspector over direct SSH
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_PORT DEPLOY_SSH_PRIVATE_KEY DEPLOY_SSH_KNOWN_HOSTS DIGEST; do
            [[ -n "${!name:-}" ]] || { echo "Missing $name" >&2; exit 1; }
          done
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ && "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$(git ls-remote origin refs/heads/test | cut -f1)" == "$GITHUB_SHA" ]] || {
            echo 'A newer test commit exists; refusing stale deployment' >&2; exit 1;
          }
          key=$(mktemp "$RUNNER_TEMP/inspector-key.XXXXXX")
          hosts=$(mktemp "$RUNNER_TEMP/inspector-known-hosts.XXXXXX")
          trap 'rm -f -- "$key" "$hosts"' EXIT
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$key"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$hosts"
          chmod 600 "$key" "$hosts"
          ssh_opts=(-F /dev/null -i "$key" -p "$DEPLOY_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$hosts" -o ConnectTimeout=15)
          target="github@$DEPLOY_HOST"
          candidate="/opt/memoia-inspector/.deploy/candidates/$GITHUB_SHA"
          # shellcheck disable=SC2029 # Validated candidate path is intentionally expanded on the runner.
          ssh "${ssh_opts[@]}" "$target" "sudo -n install -d -o root -g root -m 700 /opt/memoia-inspector /opt/memoia-inspector/.deploy /opt/memoia-inspector/.deploy/candidates '$candidate'"
          # shellcheck disable=SC2029
          tar -C deploy -cf - compose.yml deploy-inspector.sh runtime.env.example | ssh "${ssh_opts[@]}" "$target" "sudo -n tar -C '$candidate' -xf -"
          # shellcheck disable=SC2029
          ssh "${ssh_opts[@]}" "$target" "sudo -n env INSPECTOR_STAGE=test bash '$candidate/deploy-inspector.sh' init-config"
          if [[ -n "$INSPECTOR_OPENAI_API_KEY" || -n "$INSPECTOR_OPENAI_MODEL" ]]; then
            for name in INSPECTOR_OPENAI_API_KEY INSPECTOR_OPENAI_BASE_URL INSPECTOR_OPENAI_MODEL; do
              [[ -n "${!name:-}" ]] || { echo "Incomplete optional Playground config: $name" >&2; exit 1; }
            done
            # shellcheck disable=SC2029 # Secrets travel through SSH standard input, not command arguments.
            node - <<'NODE' | ssh "${ssh_opts[@]}" "$target" "sudo -n env INSPECTOR_STAGE=test bash '$candidate/deploy-inspector.sh' install-runtime-env"
          const values = [
            ['OPENAI_API_KEY', process.env.INSPECTOR_OPENAI_API_KEY],
            ['OPENAI_BASE_URL', process.env.INSPECTOR_OPENAI_BASE_URL],
            ['OPENAI_MODEL', process.env.INSPECTOR_OPENAI_MODEL],
          ];
          for (const [name, value] of values) {
            if (!value || /[\r\n\0$#\s'"\\]/.test(value)) throw new Error(`Invalid ${name} secret`);
            process.stdout.write(`${name}=${value}\n`);
          }
          NODE
          fi
          # shellcheck disable=SC2029
          ssh "${ssh_opts[@]}" "$target" "sudo -n env INSPECTOR_STAGE=test bash '$candidate/deploy-inspector.sh' apply 'ghcr.io/jianify-llc/memoia-inspector@$DIGEST' '$GITHUB_SHA' '$GITHUB_RUN_ID'"
          printf 'Inspector installed locally: source=%s digest=%s; Access acceptance remains separate.\n' "$GITHUB_SHA" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
