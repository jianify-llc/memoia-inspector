name: Memoia Inspector · Verify

on:
  workflow_call:
    inputs:
      mode:
        type: string
        default: publish
  workflow_dispatch:
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Verify the exact clean candidate
        env:
          VERIFY_MODE: ${{ github.event_name == 'pull_request' && 'pr' || github.event_name == 'merge_group' && 'pr' || inputs.mode || 'full' }}
          VERIFY_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
        run: python3 scripts/verify_local.py --mode "$VERIFY_MODE" --base "$VERIFY_BASE" --checkout
