name: Memoia Inspector · Online

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require version tag at current Release HEAD
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected a stable vMAJOR.MINOR.PATCH tag' >&2; exit 1; }
          release_sha=$(git ls-remote origin refs/heads/release | cut -f1)
          [[ -n "$release_sha" && "$GITHUB_SHA" == "$release_sha" ]] || {
            echo "Tag SHA $GITHUB_SHA is not the current release HEAD $release_sha" >&2; exit 1;
          }

  verify:
    needs: validate-tag
    uses: ./.github/workflows/verify.yml

  build-online:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 75
    concurrency:
      group: inspector-online-image-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.identity.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require the reviewed Next.js version
        run: |
          node - <<'NODE'
          const version = require('./package.json').dependencies.next;
          if (version !== '15.5.26') throw new Error(`Unreviewed Next.js version: ${version}`);
          NODE
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check whether this immutable version already exists
        id: existing
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$IMAGE:$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Build the Online image once on AMD64 and ARM64
        if: ${{ steps.existing.outputs.exists != 'true' }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          build-args: SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
      - name: Validate published digest, platforms and source
        id: identity
        run: |
          set -euo pipefail
          version="$IMAGE:$GITHUB_REF_NAME"
          docker buildx imagetools inspect "$version" --raw > "$RUNNER_TEMP/manifest.json"
          digest=$(docker buildx imagetools inspect "$version" --format '{{json .Manifest}}' | jq -r .digest)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          anonymous_config=$(mktemp -d)
          trap 'rm -rf -- "$anonymous_config"' EXIT
          for arch in amd64 arm64; do
            platform_digest=$(jq -er --arg arch "$arch" '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest] | if length == 1 then .[0] else error("Missing or duplicate platform") end' "$RUNNER_TEMP/manifest.json")
            DOCKER_CONFIG="$anonymous_config" docker pull --platform "linux/$arch" "$IMAGE@$platform_digest"
            docker image inspect "$IMAGE@$platform_digest" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' | grep -Fx "$GITHUB_SHA"
          done
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          printf 'Online artifact: source=%s image=%s@%s\n' "$GITHUB_SHA" "$IMAGE" "$digest" >> "$GITHUB_STEP_SUMMARY"

  deploy-online:
    needs: build-online
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: memoia-inspector-online-deployment
      cancel-in-progress: false
    environment:
      name: online
      url: https://memoia-inspector.jianify.dev
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
      INSPECTOR_OPENAI_API_KEY: ${{ secrets.INSPECTOR_OPENAI_API_KEY }}
      INSPECTOR_OPENAI_BASE_URL: ${{ secrets.INSPECTOR_OPENAI_BASE_URL }}
      INSPECTOR_OPENAI_MODEL: ${{ secrets.INSPECTOR_OPENAI_MODEL }}
      DIGEST: ${{ needs.build-online.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify approval boundary and candidate before SSH
        run: |
          set -euo pipefail
          [[ "$(git ls-remote origin refs/heads/release | cut -f1)" == "$GITHUB_SHA" ]] || {
            echo 'A newer Release commit exists; refusing stale Online deployment' >&2; exit 1;
          }
          for name in DEPLOY_HOST DEPLOY_PORT DEPLOY_SSH_PRIVATE_KEY DEPLOY_SSH_KNOWN_HOSTS DIGEST; do
            [[ -n "${!name:-}" ]] || { echo "Missing online Environment value: $name" >&2; exit 1; }
          done
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ && "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
      - name: Update only Inspector on the Online host
        run: |
          set -euo pipefail
          key=$(mktemp "$RUNNER_TEMP/inspector-online-key.XXXXXX")
          hosts=$(mktemp "$RUNNER_TEMP/inspector-online-hosts.XXXXXX")
          trap 'rm -f -- "$key" "$hosts"' EXIT
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$key"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$hosts"
          chmod 600 "$key" "$hosts"
          ssh_opts=(-F /dev/null -i "$key" -p "$DEPLOY_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$hosts" -o ConnectTimeout=15)
          target="github@$DEPLOY_HOST"
          candidate="/opt/memoia-inspector/.deploy/candidates/$GITHUB_SHA"
          # shellcheck disable=SC2029 # Validated candidate identity expands on the runner.
          ssh "${ssh_opts[@]}" "$target" "sudo -n install -d -o root -g root -m 700 /opt/memoia-inspector /opt/memoia-inspector/.deploy /opt/memoia-inspector/.deploy/candidates '$candidate'"
          # shellcheck disable=SC2029
          tar -C deploy -cf - compose.yml deploy-inspector.sh runtime.env.example | ssh "${ssh_opts[@]}" "$target" "sudo -n tar -C '$candidate' -xf -"
          # shellcheck disable=SC2029
          ssh "${ssh_opts[@]}" "$target" "sudo -n env INSPECTOR_STAGE=online bash '$candidate/deploy-inspector.sh' init-config"
          if [[ -n "$INSPECTOR_OPENAI_API_KEY" || -n "$INSPECTOR_OPENAI_MODEL" ]]; then
            for name in INSPECTOR_OPENAI_API_KEY INSPECTOR_OPENAI_BASE_URL INSPECTOR_OPENAI_MODEL; do
              [[ -n "${!name:-}" ]] || { echo "Incomplete optional Playground config: $name" >&2; exit 1; }
            done
            # shellcheck disable=SC2029 # Runtime values travel through SSH standard input.
            node - <<'NODE' | ssh "${ssh_opts[@]}" "$target" "sudo -n env INSPECTOR_STAGE=online bash '$candidate/deploy-inspector.sh' install-runtime-env"
          const values = [
            ['OPENAI_API_KEY', process.env.INSPECTOR_OPENAI_API_KEY],
            ['OPENAI_BASE_URL', process.env.INSPECTOR_OPENAI_BASE_URL],
            ['OPENAI_MODEL', process.env.INSPECTOR_OPENAI_MODEL],
          ];
          for (const [name, value] of values) {
            if (!value || /[\r\n\0$#\s'"\\]/.test(value)) throw new Error(`Invalid ${name} secret`);
            process.stdout.write(`${name}=${value}\n`);
          }
          NODE
          fi
          # shellcheck disable=SC2029
          ssh "${ssh_opts[@]}" "$target" "sudo -n env INSPECTOR_STAGE=online bash '$candidate/deploy-inspector.sh' apply 'ghcr.io/jianify/memoia-inspector@$DIGEST' '$GITHUB_SHA' '$GITHUB_RUN_ID'"
          printf 'Online container accepted locally: source=%s digest=%s. External Access and management acceptance remain separate.\n' "$GITHUB_SHA" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
